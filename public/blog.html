<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>SecureBlog - Articles</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="wide">
    <div class="header_options">
      <div id="header"></div>
      <button type="button" id="logout" class="btn small">Se déconnecter</button>
    </div>

    <div class="card">
      <h3 id="welcome"></h3>
      <p>Votre session est protégée par un cookie HttpOnly.</p>
      <form>
        <input type="text" placeholder="Titre">
        <textarea rows="5" placeholder="Contenu"></textarea>
        <button type="submit">Publier</button>
      </form>
    </div>

    <h3>Articles</h3>
    <div class="card article">
      <h4>test titre un</h4>
      <p>test contenu</p>
      <span class="muted">27/09/2026 23:28:26</span>
    </div>
  </main>
  <script src="/header.js"></script>
  <script src="/auth.js"></script>
</body>
</html>
