<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>SecureBlog - Inscription</title>
  <link rel="stylesheet" href="/styles/style.css">
</head>
<body>
  <main>
    <div id="header"></div>
    <div class="card">
      <h2>Inscription</h2>
      <form id="register-form">
        <input type="email" name="email" placeholder="Email" required>
        <input type="password" name="password" placeholder="Mot de passe (8 caractères minimum)" minlength="8" maxlength="72" required>
        <p class="error" role="alert"></p>
        <button type="submit">Créer le compte</button>
      </form>
      <div class="divider">ou</div>
      <a href="/auth/google" class="btn btn-google">
        <img src="https://cdn.jsdelivr.net/npm/devicon@2.16.0/icons/google/google-original.svg" alt="" width="18" height="18">
        Se connecter avec Google
      </a>
      <p><a href="/login">J'ai déjà un compte</a></p>
    </div>
  </main>
  <script src="/header.js"></script>
  <script src="/auth.js"></script>
</body>
</html>
