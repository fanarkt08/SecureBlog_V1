<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>SecureBlog - Inscription</title>
  <link rel="stylesheet" href="/styles/style.css">
</head>
<body>
  <main>
    <div id="header"></div>
    <div class="card">
      <h2>Inscription</h2>
      <form id="register-form">
        <input type="email" name="email" placeholder="Email" required>
        <input type="password" name="password" placeholder="Mot de passe (8 caractères minimum)" minlength="8" maxlength="72" required>
        <p class="error" role="alert"></p>
        <div class="register-buttons">
          <button type="submit" class="btn-register">
            Créer le compte
          </button>
          <a href="/auth/google" class="btn-google">
            S'inscrire avec Google
          </a>
          <a href="/auth/github" class="btn-github">
            S'inscrire avec GitHub
          </a>
        </div>
      </form>
      <p><a href="/login">J'ai déjà un compte</a></p>
    </div>
  </main>
  <script src="/header.js"></script>
  <script src="/auth.js"></script>
</body>
</html>
