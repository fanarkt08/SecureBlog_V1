<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>SecureBlog - Connexion</title>
  <link rel="stylesheet" href="/styles/style.css">
</head>
<body>
  <main>
    <div id="header"></div>
    <div class="card">
      <h2>Connexion</h2>
      <form id="login-form">
        <input type="email" name="email" placeholder="Email" required>
        <input type="password" name="password" placeholder="Mot de passe (8 caractères minimum)" minlength="8" maxlength="72" required>
        <p class="error" role="alert"></p>
        <div class="login-buttons">
          <button type="submit" class="btn-login">
            Se connecter
          </button>
          <a href="/auth/google" class="btn-google">
            Se connecter via Google
          </a>
          <a href="/auth/github" class="btn-github">
            Se connecter GitHub
          </a>
        </div>
      </form>
      <p><a href="/register">Créer un compte</a></p>
    </div>
  </main>
  <script src="/header.js"></script>
  <script src="/auth.js"></script>
</body>
</html>
