<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>SecureBlog - Connexion</title>
  <link rel="stylesheet" href="/styles/style.css">
</head>
<body>
  <main>
    <div id="header"></div>
    <div class="card">
      <h2>Connexion</h2>
      <form id="login-form">
        <input type="email" name="email" placeholder="Email" required>
        <input type="password" name="password" placeholder="Mot de passe (8 caractères minimum)" minlength="8" maxlength="72" required>
        <p class="error" role="alert"></p>
        <button type="submit">Se connecter</button>
      </form>
      <div class="divider">ou</div>
      <a href="/auth/google" class="btn btn-oauth">
        <img src="https://cdn.jsdelivr.net/npm/devicon@2.16.0/icons/google/google-original.svg" alt="" width="18" height="18">
        Se connecter avec Google
      </a>
      <a href="/auth/github" class="btn btn-oauth">
        <img src="https://cdn.jsdelivr.net/npm/devicon@2.16.0/icons/github/github-original.svg" alt="" width="18" height="18">
        Se connecter avec GitHub
      </a>
      <p><a href="/register">Créer un compte</a></p>
    </div>
  </main>
  <script src="/header.js"></script>
  <script src="/auth.js"></script>
</body>
</html>
