<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>SecureBlog - Articles</title>
  <link rel="stylesheet" href="/styles/style.css">
</head>
<body>
  <main class="wide">
    <div class="header_options">
      <div id="header"></div>
      <button type="button" id="logout" class="btn small">Se déconnecter</button>
    </div>

    <div class="card">
      <h3 id="welcome"></h3>
      <p>Votre session est protégée par un cookie HttpOnly.</p>
      <form id="article-form">
        <input type="text" name="title" placeholder="Titre" maxlength="255" required>
        <textarea name="content" rows="5" placeholder="Contenu" required></textarea>
        <p class="error" role="alert"></p>
        <button type="submit">Publier</button>
      </form>
    </div>

    <h3>Articles</h3>
    <div id="default-article"></div>
    <div id="articles" class="articles"></div>

  </main>
  <script src="/header.js"></script>
  <script src="/auth.js"></script>
  <script src="/default_article.js"></script>
  <script src="/articles.js"></script>
</body>
</html>
